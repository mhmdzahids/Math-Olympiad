<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Clay badge gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223068" />
      <stop offset="100%" stop-color="#151d45" />
    </linearGradient>
    <!-- Clay highlight -->
    <linearGradient id="badgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <!-- Compass leg gradient -->
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8d7fd" />
      <stop offset="100%" stop-color="#83b3f2" />
    </linearGradient>
    <!-- Soft clay shadow -->
    <filter id="clayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a102b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 3D Clay Badge Icon -->
  <g filter="url(#clayShadow)">
    <!-- Base Rounded Square Badge -->
    <rect x="8" y="7" width="76" height="76" rx="22" fill="url(#badgeGrad)" />
    <rect x="8" y="7" width="76" height="76" rx="22" fill="url(#badgeHighlight)" />

    <!-- Drafting Compass (Drawing Divider) -->
    <!-- Top Pivot Assembly -->
    <circle cx="46" cy="27" r="8" fill="#151d45" stroke="url(#compassGrad)" stroke-width="4.5" />
    <circle cx="46" cy="27" r="3" fill="url(#compassGrad)" />
    
    <!-- Left Leg -->
    <path d="M42 32 L27 68" stroke="url(#compassGrad)" stroke-width="6.5" stroke-linecap="round" />
    <!-- Right Leg -->
    <path d="M50 32 L65 68" stroke="url(#compassGrad)" stroke-width="6.5" stroke-linecap="round" />
    
    <!-- Compass Steel Tips -->
    <path d="M27 68 L25 73" stroke="#223068" stroke-width="3" stroke-linecap="round" />
    <path d="M65 68 L67 73" stroke="#223068" stroke-width="3" stroke-linecap="round" />

    <!-- Horizontal Adjustment Wheel & Bar -->
    <line x1="28" y1="52" x2="64" y2="52" stroke="url(#compassGrad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="46" cy="52" r="4.5" fill="#151d45" stroke="url(#compassGrad)" stroke-width="3" />
  </g>

  <!-- MathOlympiad Typography -->
  <text 
    x="98" 
    y="59" 
    fill="#1a2456" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="44" 
    letter-spacing="-0.8px"
  >MathOlympiad</text>
</svg>
